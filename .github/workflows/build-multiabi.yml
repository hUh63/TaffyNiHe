name: Build multi-ABI APK

# 多 ABI 支持流水线：为 4 个 ABI 各自造齐 native so
#   librz_native.so (rizin+LIEF 自建) / libcapstone / libkeystone / libunicorn (自建)
#   libcloudflared.so (Go 交叉编译) / libfrida_server.so (官方下载) / libc++_shared.so (NDK)
# 然后组装进 app/src/main/jniLibs/<abi>/ 并使用 -PabiFilter 打包多 ABI APK。
#
# 说明：libdsmcp_native.so / libblutter_*.so / libxanso_native.so 目前仅有 arm64 版，
# 非 arm64 ABI 缺失时对应能力按塔菲「可优雅降级」原则降级（不影响 App 启动与核心引擎）。

on:
  workflow_dispatch:
    inputs:
      abis:
        description: '要打包的 ABI（逗号分隔，与矩阵一致即可）'
        required: false
        default: 'arm64-v8a,armeabi-v7a,x86,x86_64'
      rizin_ref:
        description: 'rizin git ref（默认 v0.9.1；上游 file.c 修复后可改 main）'
        required: false
        default: 'v0.9.1'
  push:
    paths:
      - '.github/workflows/build-multiabi.yml'
      - 'build-native-android.sh'
      - 'rizin-cross-*.ini'
      - 'third_party/patches/**'
      - 'app/src/main/cpp/**'
      - 'scripts/build-unidbg-native.sh'
      - 'tools/**'
      - 'app/build.gradle.kts'

concurrency:
  group: build-multiabi-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prep:
    name: prep-${{ matrix.abi }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, armeabi-v7a, x86, x86_64]
    steps:
      - name: 检出代码 (Checkout)
        uses: actions/checkout@v5

      - name: 准备 Android SDK
        run: |
          set -e
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if [ ! -d "$SDK" ]; then SDK=/usr/local/lib/android/sdk; fi
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          SM_BIN="$(ls -d "$SDK"/cmdline-tools/*/bin 2>/dev/null | head -1)"
          if [ -n "$SM_BIN" ]; then
            echo "$SM_BIN" >> "$GITHUB_PATH"
            echo "使用 runner 自带 cmdline-tools: $SM_BIN"
          else
            echo "::error::未找到 sdkmanager，无法继续"; exit 1
          fi

      - name: 安装 NDK 与构建工具
        run: |
          set -e
          for i in 1 2 3 4; do
            echo "尝试安装 NDK (第 $i 次)..."
            if sdkmanager --install "ndk;28.2.13676358" "platform-tools" > /dev/null 2>&1; then
              echo "NDK 安装成功"; break
            fi
            [ "$i" = "4" ] && { echo "::error::sdkmanager 安装 NDK 连续失败"; exit 1; }
            sleep 15
          done
          echo "ANDROID_NDK_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}/ndk/28.2.13676358" >> "$GITHUB_ENV"
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends meson ninja-build pkg-config cmake golang-go

      - name: 克隆源码 (rizin / LIEF / capstone / keystone / unicorn / unidbg)
        run: |
          set -e
          clone() { [ -d "$2" ] || git clone --depth 1 $3 "$1" "$2"; }
          RIZIN_REF="${{ inputs.rizin_ref || 'v0.9.1' }}"
          echo "rizin ref = $RIZIN_REF"
          [ -d third_party/rizin-src/librz/include ] || git clone --depth 1 --branch "$RIZIN_REF" https://github.com/rizinorg/rizin.git third_party/rizin-src
          [ -d third_party/xAnSo-src ] || git clone --depth 1 https://github.com/freakishfox/xAnSo.git third_party/xAnSo-src
          [ -d third_party/lief-src ] || git clone --depth 1 --branch 0.16.1 https://github.com/lief-project/LIEF.git third_party/lief-src
          [ -d third_party/zhkl-capstone-src ] || (git clone --depth 1 https://github.com/zhkl0228/capstone.git third_party/zhkl-capstone-src \
            || git clone --depth 1 --branch 4.0.2 https://github.com/capstone-engine/capstone.git third_party/zhkl-capstone-src)
          [ -d third_party/keystone-engine-src ] || git clone --depth 1 --branch 0.9.2 https://github.com/keystone-engine/keystone.git third_party/keystone-engine-src
          # unicorn 必须用 zhkl0228 fork 的 **unicorn2 分支**：unidbg 0.9.9 的 JNI 桥要用
          # uc_ctl_set_cpu_model / uc_ctl_remove_cache / UC_CPU_ARM64_MAX，这些只在 unicorn2
          # 分支里（master / unicorn-engine 官方仓库已移除，桥会编译失败）。
          [ -f third_party/unicorn-zhkl0228/include/unicorn/arm64.h ] || \
            git clone --depth 1 --branch unicorn2 https://github.com/zhkl0228/unicorn.git third_party/unicorn-zhkl0228
          # unidbg 本体：libunicorn.so 必须是「unicorn 引擎 + backend/unicorn2 JNI 桥」的
          # 链接产物（只打包裸引擎会让后端看似可用、session_open 必失败，issue #91）。
          # 版本与 app 依赖的 unidbg 0.9.9 对齐（tag v0.9.9）。
          [ -f third_party/unidbg-src/backend/unicorn2/src/main/native/unicorn.c ] || \
            git clone --depth 1 --branch v0.9.9 https://github.com/zhkl0228/unidbg.git third_party/unidbg-src

      - name: 缓存 rizin/LIEF 产物
        uses: actions/cache@v4
        with:
          path: |
            rizin-build/${{ matrix.abi }}
            third_party/lief-build/${{ matrix.abi }}
          key: native-${{ matrix.abi }}-${{ hashFiles('rizin-cross-*.ini', 'third_party/patches/**') }}

      - name: 编译 rizin + LIEF
        env:
          TARGET_ABI: ${{ matrix.abi }}
        run: bash build-native-android.sh

      - name: 链接 librz_native.so
        run: |
          set -euo pipefail
          cmake -G Ninja -S app/src/main/cpp -B "build/native-${{ matrix.abi }}" \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=${{ matrix.abi }} -DANDROID_PLATFORM=android-26 -DCMAKE_BUILD_TYPE=Release
          cmake --build "build/native-${{ matrix.abi }}" --target rz_native --parallel 4
          mkdir -p "app/src/main/jniLibs/${{ matrix.abi }}"
          cp "build/native-${{ matrix.abi }}/librz_native.so" "app/src/main/jniLibs/${{ matrix.abi }}/"
          # xanso_native(ELF section 重建) —— 源码已 clone, 一并编译
          cmake --build "build/native-${{ matrix.abi }}" --target xanso_native --parallel 4
          cp "build/native-${{ matrix.abi }}/libxanso_native.so" "app/src/main/jniLibs/${{ matrix.abi }}/"
          # Exbin 自研 microcode+SSA 反编译器（libexbin_decomp.so）——
          # 源码随仓库提交（app/src/main/cpp/exbin_decomp/），无第三方依赖，直接编译
          cmake --build "build/native-${{ matrix.abi }}" --target exbin_decomp --parallel 4
          cp "build/native-${{ matrix.abi }}/exbin_decomp/libexbin_decomp.so" "app/src/main/jniLibs/${{ matrix.abi }}/"
          ls -lh "app/src/main/jniLibs/${{ matrix.abi }}/libexbin_decomp.so"

      - name: 编译 unidbg 原生库 (capstone/keystone/unicorn)
        run: |
          # unicorn(QEMU) 依赖 __uint128_t，只有 64 位 ABI 可编译；32 位(armeabi-v7a/x86)跳过，
          # 与上游 SOMCP 的做法一致(32 位 ABI 不打包 unicorn)。
          EXTRA=""
          case "${{ matrix.abi }}" in
            armeabi-v7a|x86) EXTRA="-SkipUnicorn" ;;
          esac
          bash scripts/build-unidbg-native.sh -Abi ${{ matrix.abi }} -Ndk "$ANDROID_NDK_HOME" $EXTRA

      - name: 门禁 - libunicorn.so 必须是 unidbg unicorn2 JNI 桥
        run: |
          set -euo pipefail
          case "${{ matrix.abi }}" in
            armeabi-v7a|x86)
              # 32 位 ABI 不打包 unicorn（QEMU/unicorn 需要 __uint128_t），属正常设计
              echo "32 位 ABI 跳过 libunicorn.so 桥校验"
              ;;
            *)
              # 裸引擎能加载成功但 session_open 必失败（issue #91 同坑）——
              # 这个门禁保证发布包里不可能再出现"看似可用"的假后端。
              python3 tools/verify_unicorn_jni.py "app/src/main/jniLibs/${{ matrix.abi }}/libunicorn.so"
              ;;
          esac

      - name: 下载 cloudflared (官方预编译二进制)
        run: |
          set -euo pipefail
          # 直接用官方 release 的 linux 二进制(与仓库内置 libcloudflared.so 同源)，
          # 避免在 CI 里依赖 Go 1.26 toolchain(GOOS=android 交叉编译不可用)。
          CF_VER="2026.9.1"
          case "${{ matrix.abi }}" in
            arm64-v8a)   C=arm64 ;;
            armeabi-v7a) C=arm ;;
            x86)         C=386 ;;
            x86_64)      C=amd64 ;;
          esac
          curl -sL --retry 3 --max-time 500 \
            "https://github.com/cloudflare/cloudflared/releases/download/${CF_VER}/cloudflared-linux-${C}" \
            -o "app/src/main/jniLibs/${{ matrix.abi }}/libcloudflared.so"
          ls -lh "app/src/main/jniLibs/${{ matrix.abi }}/libcloudflared.so"

      - name: 注入 frida-server
        run: |
          set -euo pipefail
          FRIDA_VERSION="17.18.0"
          case "${{ matrix.abi }}" in
            arm64-v8a)   A=arm64 ;;
            armeabi-v7a) A=arm ;;
            x86)         A=x86 ;;
            x86_64)      A=x86_64 ;;
          esac
          curl -sL --retry 3 --max-time 500 \
            "https://github.com/frida/frida/releases/download/${FRIDA_VERSION}/frida-server-${FRIDA_VERSION}-android-${A}.xz" -o /tmp/frida.xz
          python3 - <<PY
          import lzma
          data = lzma.open('/tmp/frida.xz').read()
          open('$GITHUB_WORKSPACE/app/src/main/jniLibs/${{ matrix.abi }}/libfrida_server.so','wb').write(data)
          print('frida-server %.1f MB' % (len(data)/1048576))
          PY

      - name: 复制 libc++_shared.so（NDK，路径按三元组解析）
        run: |
          set -euo pipefail
          D="app/src/main/jniLibs/${{ matrix.abi }}"
          # 旧实现把 NDK 目录当成 ABI 名（.../sysroot/usr/lib/x86_64/...），实际是三元组名
          # （x86_64-linux-android / aarch64-linux-android / arm-linux-androideabi /
          # i686-linux-android），而且结尾是 `|| true` → 静默失败：非 arm64 的 APK 里
          # 根本没有 libc++_shared.so，而 librz_native.so/LIEF 需要它，运行期加载直接失败。
          case "${{ matrix.abi }}" in
            arm64-v8a)   T=aarch64-linux-android ;;
            armeabi-v7a) T=arm-linux-androideabi ;;
            x86)         T=i686-linux-android ;;
            x86_64)      T=x86_64-linux-android ;;
          esac
          SRC="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/$T/libc++_shared.so"
          if [ ! -f "$SRC" ]; then
            SRC="$(find "$ANDROID_NDK_HOME" -name libc++_shared.so -print -quit 2>/dev/null || true)"
          fi
          [ -n "${SRC:-}" ] && [ -f "$SRC" ] || { echo "::error::NDK 里找不到 libc++_shared.so"; exit 1; }
          cp "$SRC" "$D/"
          ls -lh "$D/libc++_shared.so"

      - name: 校验本 ABI 的 so（硬门禁 + ELF 架构一致性）
        run: |
          set -euo pipefail
          D="app/src/main/jniLibs/${{ matrix.abi }}"
          echo "=== ${{ matrix.abi }} jniLibs ==="
          ls -lh "$D/"
          # 必需二进制缺一即红。历史上 cloudflared/frida-server 下载失败只 warning，
          # 结果包里少 so 却照样出包（用户侧才炸），这里改成硬门禁。
          for f in librz_native.so libcloudflared.so libfrida_server.so \
                   libcapstone.so libkeystone.so libc++_shared.so; do
            [ -s "$D/$f" ] || { echo "::error::${{ matrix.abi }} 缺少必需二进制 $f"; exit 1; }
          done
          case "${{ matrix.abi }}" in
            armeabi-v7a|x86) echo "32 位 ABI：不要求 libunicorn.so（QEMU/__uint128_t）" ;;
            *) [ -s "$D/libunicorn.so" ] || { echo "::error::${{ matrix.abi }} 缺少 libunicorn.so"; exit 1; } ;;
          esac
          # ELF 头校验：e_machine 必须与 ABI 匹配，挡"下载到错误架构/被 CDN 截断"的假绿
          python3 - "$D" "${{ matrix.abi }}" <<'PY'
          import os, struct, sys
          d, abi = sys.argv[1], sys.argv[2]
          want = {"arm64-v8a": 0xB7, "armeabi-v7a": 0x28, "x86": 0x03, "x86_64": 0x3E}[abi]
          bad = []
          for name in sorted(os.listdir(d)):
              if not name.endswith(".so"):
                  continue
              p = os.path.join(d, name)
              with open(p, "rb") as fh:
                  head = fh.read(20)
              if len(head) < 20 or head[:4] != b"\x7fELF":
                  bad.append(f"{name}: 不是 ELF（下载失败/被截断？）")
                  continue
              machine = struct.unpack_from("<H", head, 18)[0]
              print(f"  {name:26s} {os.path.getsize(p)/1048576:8.2f} MB  e_machine=0x{machine:02X}")
              if machine != want:
                  bad.append(f"{name}: e_machine=0x{machine:02X} 与 ABI {abi}(0x{want:02X}) 不符")
          if bad:
              for b in bad:
                  print(f"::error::{b}")
              sys.exit(1)
          print("ELF 架构校验通过")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: jniLibs-${{ matrix.abi }}
          path: app/src/main/jniLibs/${{ matrix.abi }}/
          if-no-files-found: error

  package:
    name: package-multiabi-apk
    needs: prep
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 配置 JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 下载各 ABI 的 native so
        uses: actions/download-artifact@v4
        with:
          pattern: jniLibs-*
          path: app/src/main/jniLibs

      - name: 归位到 jniLibs/<abi>/
        run: |
          set -euo pipefail
          for d in app/src/main/jniLibs/jniLibs-*; do
            [ -d "$d" ] || continue
            abi="${d##*jniLibs-}"
            mkdir -p "app/src/main/jniLibs/$abi"
            cp -f "$d"/* "app/src/main/jniLibs/$abi/" || true
            rm -rf "$d"
          done
          echo "=== 最终 jniLibs 结构 ==="
          find app/src/main/jniLibs -name '*.so' | sort

      - name: 恢复签名密钥
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > release/so-reverse-mcp-release.jks
          fi
          if [ -n "${{ secrets.KEYSTORE_PROPERTIES }}" ]; then
            echo "${{ secrets.KEYSTORE_PROPERTIES }}" > release/keystore.properties
          fi
          test -f release/so-reverse-mcp-release.jks || { echo "::error::缺少签名密钥"; exit 1; }
          test -f release/keystore.properties || { echo "::error::缺少 keystore.properties"; exit 1; }

      - name: 运行单元测试 (Run unit tests)
        # 发版路径的质量门: 与 build-apk.yml 同一套纯 JVM 单元测试(不依赖 Android 运行时/Compose)。
        # 放在打包之前 fail fast —— 测试不过就不产出、不发布 APK, 保证 tag 出来的版本一定有测试兜底。
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew test --no-daemon --stacktrace

      - name: 打包多 ABI APK
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace \
            -PabiFilter=arm64-v8a,armeabi-v7a,x86,x86_64

      - name: 收集 APK + SHA256SUMS + mapping
        run: |
          set -euo pipefail
          mkdir -p apk-output
          find app/build/outputs/apk -name '*.apk' -exec cp {} apk-output/ \;
          ls -lh apk-output/
          [ -f app/build/outputs/mapping/release/mapping.txt ] && cp app/build/outputs/mapping/release/mapping.txt apk-output/mapping.txt || true
          ( cd apk-output && sha256sum *.apk | tee SHA256SUMS )

      - name: 上传多 ABI APK 产物
        uses: actions/upload-artifact@v4
        with:
          name: multiabi-apk
          path: |
            apk-output/*.apk
            apk-output/SHA256SUMS
            apk-output/mapping.txt
          if-no-files-found: error

      - name: 发布 Release（tag 触发·多 ABI）
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          # v1.3.9: 从 softprops/action-gh-release 改为「先建 draft -> 逐个上传（每文件最多 5 次
          # 重试）-> 全部成功才发布」。原实现并发上传 6 个资产（含 183MB APK / 108MB mapping），
          # runner 出网抖动时会整体卡死或超时（v1.3.9 首次发布即因此失败、draft 里只落了 4 个资产）；
          # 逐个上传 + 重试既提高成功率，也保证半成品不会以已发布状态对外可见。
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG 已存在（复用 draft）"
          else
            gh release create "$TAG" --draft --title "$TAG" --generate-notes
          fi
          for f in apk-output/*.apk apk-output/SHA256SUMS apk-output/mapping.txt; do
            if [ ! -f "$f" ]; then
              echo "缺少发布资产: $f"
              exit 1
            fi
            ok=0
            for i in 1 2 3 4 5; do
              if gh release upload "$TAG" "$f" --clobber; then
                ok=1
                echo "已上传 $f（第 $i 次尝试）"
                break
              fi
              echo "上传 $f 失败，重试 $i/5 ..."
              sleep 15
            done
            if [ "$ok" != "1" ]; then
              echo "上传失败且重试耗尽: $f"
              exit 1
            fi
          done
          gh release edit "$TAG" --draft=false --prerelease=false
          echo "Release $TAG 已发布" 
