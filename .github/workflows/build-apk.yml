name: Build arm64-v8a APK

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      build_type:
        description: '构建类型 (Build type)'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # 首次冷构建需编译/打包体积较大的 native 依赖(约 181MB .so) + full Gradle 依赖缓存填充,
    # 45 分钟在无缓存冷启动下可能紧张, 放宽到 60 分钟; 增量构建通常 15 分钟内完成。
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - name: 检出代码 (Checkout)
        uses: actions/checkout@v5

      - name: 验证 arm64-v8a 预编译 so (Verify native libs)
        run: |
          echo "=== jniLibs 内容 ==="
          find app/src/main/jniLibs -name '*.so' -exec ls -lh {} \; || echo "警告: jniLibs 目录为空或不存在"
          echo ""
          echo "=== libs 内容 ==="
          find app/libs -name '*.jar' -exec ls -lh {} \; 2>/dev/null || echo "警告: libs 目录为空或不存在"
          echo "=== jar 完整性校验（排查 checkout 损坏）==="
          sha256sum app/libs/*.jar 2>/dev/null || true
          python3 scripts/check_jars.py

      - name: 配置 JDK 17 (Setup JDK)
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: 配置 Gradle (Setup Gradle)
        # cache-encryption-key 是可选的: 未配置 secret 时为空字符串, setup-gradle 会视为无加密,
        # 不会导致失败。仅当你需要加密上传到公共缓存时才需要设置 GRADLE_ENCRYPTION_KEY。
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: 确定构建类型 (Determine build type)
        id: build_type
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "type=${{ inputs.build_type }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.event_name }}" = "push" ] && [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "type=release" >> $GITHUB_OUTPUT
          elif [ "${{ github.event_name }}" = "push" ]; then
            echo "type=release" >> $GITHUB_OUTPUT
          else
            echo "type=debug" >> $GITHUB_OUTPUT
          fi

      - name: 准备签名密钥 (Prepare signing keystore)
        if: steps.build_type.outputs.type == 'release'
        run: |
          # 如果仓库中没有 keystore.properties 或 keystore 文件，从 secrets 中恢复
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > release/so-reverse-mcp-release.jks
            echo "已从 GitHub Secrets 恢复签名密钥"
          fi
          if [ -n "${{ secrets.KEYSTORE_PROPERTIES }}" ]; then
            echo "${{ secrets.KEYSTORE_PROPERTIES }}" > release/keystore.properties
            echo "已从 GitHub Secrets 恢复密钥配置"
          fi
          # ---- 校验签名材料完整性 (提前拦截, 避免 build 阶段才报错) ----
          if [ ! -f release/so-reverse-mcp-release.jks ]; then
            echo "::error::签名密钥文件 release/so-reverse-mcp-release.jks 不存在"
            echo "请配置 GitHub Secrets: KEYSTORE_BASE64 + KEYSTORE_PROPERTIES, 或将签名文件提交到 release/ 目录"
            exit 1
          fi
          if [ ! -f release/keystore.properties ]; then
            echo "::error::签名密钥配置 release/keystore.properties 不存在"
            echo "该文件包含 storeFile/storePassword/keyAlias/keyPassword。请提供它或配置 KEYSTORE_PROPERTIES secret"
            exit 1
          fi
          # 校验关键字段非空(storePassword/keyPassword/keyAlias 任一为空都会让 gradle 签名失败)
          MISSING=""
          for KEY in storeFile storePassword keyAlias keyPassword; do
            VAL=$(grep -E "^${KEY}=" release/keystore.properties | head -1 | cut -d= -f2-)
            if [ -z "$VAL" ]; then
              MISSING="${MISSING} ${KEY}"
            fi
          done
          if [ -n "$MISSING" ]; then
            echo "::error::keystore.properties 缺少必填字段:${MISSING}"
            echo "请在 release/keystore.properties 中补齐: storeFile, storePassword, keyAlias, keyPassword"
            exit 1
          fi
          echo "签名材料校验通过: jks=$([ -f release/so-reverse-mcp-release.jks ] && echo 'OK' || echo '缺失') properties=OK"
          ls -l release/so-reverse-mcp-release.jks

      - name: 构建 arm64-v8a APK (Build APK)
        run: |
          BUILD_TYPE="${{ steps.build_type.outputs.type }}"
          echo "构建类型: ${BUILD_TYPE}"
          chmod +x gradlew

          # 显式映射任务名, 避免依赖 bash 大小写参数扩展(${var^}), 在任何 shell 环境都可靠。
          case "${BUILD_TYPE}" in
            release) TASK_NAME="assembleRelease" ;;
            debug)   TASK_NAME="assembleDebug" ;;
            *)       echo "::error::未知构建类型: ${BUILD_TYPE}"; exit 1 ;;
          esac
          echo "构建任务: ${TASK_NAME}"
          ./gradlew "${TASK_NAME}" --no-daemon --stacktrace

      - name: 收集 APK 产物 (Collect APK artifacts)
        id: collect
        run: |
          BUILD_TYPE="${{ steps.build_type.outputs.type }}"
          
          echo "=== 查找 APK ==="
          # 搜索所有可能的输出目录。项目 splits 仅含 arm64-v8a 且 isUniversalApk=false,
          # 不会产出 universal 全架构包; 优先匹配 ABI 拆分目录, 通用目录仅作兜底。
          APK_FOUND=""
          for DIR in \
            "app/build/outputs/apk/arm64V8a/${BUILD_TYPE}" \
            "app/build/outputs/apk/arm64-v8a/${BUILD_TYPE}" \
            "app/build/outputs/apk/${BUILD_TYPE}"; do
            if [ -d "${DIR}" ] && [ -n "$(ls "${DIR}"/*.apk 2>/dev/null)" ]; then
              echo "找到输出目录: ${DIR}"
              find "${DIR}" -name '*.apk' -exec ls -lh {} \;
              APK_FOUND="${DIR}"
              break
            fi
          done
          
          if [ -z "${APK_FOUND}" ]; then
            echo "错误: 未找到 APK 输出目录"
            echo "已搜索的目录:"
            echo "  app/build/outputs/apk/arm64V8a/${BUILD_TYPE}"
            echo "  app/build/outputs/apk/arm64-v8a/${BUILD_TYPE}"
            echo "  app/build/outputs/apk/${BUILD_TYPE}"
            echo ""
            echo "实际构建输出:"
            find app/build/outputs -type f 2>/dev/null | head -20 || echo "(无输出)"
            exit 1
          fi
          
          # 复制 APK 到统一输出目录
          mkdir -p apk-output
          # 只为 arm64 拆分包复制, 排除 universal/其他 ABI 包(如项目未来增加 ABI 时不会误选)
          find "${APK_FOUND}" -name '*.apk' -exec cp {} apk-output/ \;
          
          # 列出最终产物
          echo ""
          echo "=== 最终 APK 产物 ==="
          ls -lh apk-output/
          
          # 输出 APK 路径供后续步骤使用
          APK_PATH=$(find apk-output -name '*.apk' -print -quit)
          if [ -z "${APK_PATH}" ]; then
            echo "::error:: apk-output 目录无 APK 产物"
            exit 1
          fi
          echo "apk_path=${APK_PATH}" >> $GITHUB_OUTPUT
          echo "apk_name=$(basename ${APK_PATH})" >> $GITHUB_OUTPUT

      - name: 上传 APK 产物 (Upload APK)
        uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.collect.outputs.apk_name || 'apk-arm64-v8a' }}
          path: apk-output/*.apk
          retention-days: 30
          if-no-files-found: error

      - name: 生成 SHA256SUMS 校验文件 (Generate SHA256SUMS)
        run: |
          cd apk-output
          echo "=== 计算 SHA-256 ==="
          sha256sum *.apk | tee SHA256SUMS
          echo ""
          echo "=== SHA256SUMS 内容 ==="
          cat SHA256SUMS
          echo "sha256sums=$(ls SHA256SUMS)" >> $GITHUB_OUTPUT

      - name: 收集 R8 mapping (反混淆映射)
        if: steps.build_type.outputs.type == 'release'
        run: |
          MAPPING="app/build/outputs/mapping/release/mapping.txt"
          if [ -f "${MAPPING}" ]; then
            cp "${MAPPING}" apk-output/mapping.txt
            ls -lh apk-output/mapping.txt
          else
            echo "::warning:: 未找到 mapping.txt (${MAPPING})"
          fi

      - name: 创建 GitHub Release (发布版本)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            apk-output/*.apk
            apk-output/SHA256SUMS
            apk-output/mapping.txt
          generate_release_notes: true
          draft: false
          prerelease: false
